[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heise-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for heise.de — headlines, 7 sections, search, top stories, c't & article text via the official RSS feed"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
heise-mcp = "heise_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heise_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real heise.de site"]
